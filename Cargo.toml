[package]
name = "neodots-installer"
version = "0.1.0"
edition = "2024"
description = "Preflight scanner for the Neodots NixOS installer"
license = "GPL-3.0-only"
repository = "https://github.com/kaayzouee/neodots-installer"

[[bin]]
name = "neodots-installer"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
